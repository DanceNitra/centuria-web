<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENTURIA</title>
<meta name="description" content="CENTURIA. Coming soon.">
<meta property="og:title" content="CENTURIA">
<meta property="og:description" content="Coming soon. The hundred are gathering.">
<meta property="og:image" content="media/centuria_poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d9a441; --gold-hi: #f5d58a; --ink: #000; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--ink); color: var(--gold); height: 100%; }
  body { font-family: "Cinzel", Georgia, serif; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; }
  .stage { position: relative; width: 100%; background: #000; }
  .stage video, .stage img { display: block; width: 100%; height: auto; max-height: 76vh; object-fit: contain; }
  .stage img { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  .stage.ended img { opacity: 1; }
  .sound {
    position: absolute; right: 16px; bottom: 16px; padding: 10px 16px; border-radius: 999px;
    border: 1px solid rgba(217, 164, 65, .55); background: rgba(0, 0, 0, .55); color: var(--gold-hi);
    font: 600 13px/1 "Cinzel", Georgia, serif; letter-spacing: .12em; cursor: pointer;
  }
  .sound:hover { border-color: var(--gold-hi); }
  .sound[hidden] { display: none; }
  @media (max-width: 700px) {
    .sound { position: static; display: block; margin: 18px auto 0; }
  }
  .copy { display: flex; flex-direction: column; align-items: center; justify-content: center;
          text-align: center; padding: 40px 16px 56px; gap: 14px; }
  .soon { font-size: 13px; letter-spacing: .5em; color: rgba(217, 164, 65, .75); padding-left: .5em; }
  .slogan {
    font-weight: 600; font-size: clamp(22px, 4.2vw, 46px); letter-spacing: .06em;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, #a8741f);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tally { position: fixed; right: clamp(16px, 1.6vw, 40px); bottom: clamp(16px, 1.6vw, 40px); z-index: 5; display: flex; align-items: center;
           gap: clamp(12px, 1vw, 22px); padding: clamp(10px, .8vw, 18px) clamp(14px, 1.1vw, 24px); border: 1px solid rgba(217, 164, 65, .45); border-radius: 4px;
           background: rgba(0, 0, 0, .62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
           opacity: 0; transform: translateY(6px); transition: opacity 1s ease, transform 1s ease; }
  .tally.on { opacity: 1; transform: none; }
  .tally svg { display: block; width: clamp(52px, 3.6vw, 96px); height: clamp(52px, 3.6vw, 96px); }
  .tally rect { fill: rgba(217, 164, 65, .24); }
  .tally rect.f { fill: var(--gold); }
  .tally rect.new { fill: var(--gold-hi); animation: pulse 1.6s ease-in-out 3; }
  @keyframes pulse { 50% { fill: #fff6dc; } }
  .tally .t { display: flex; flex-direction: column; gap: clamp(5px, .4vw, 10px); line-height: 1; }
  .tally .lab { font-size: clamp(10px, .65vw, 15px); letter-spacing: .38em; color: rgba(217, 164, 65, .7); }
  .tally .num { font-weight: 600; font-size: clamp(22px, 1.7vw, 40px); letter-spacing: .08em; color: var(--gold-hi); }
  .tally .num small { font-size: .6em; color: rgba(217, 164, 65, .6); letter-spacing: .12em; }
  @media (max-width: 700px) { .tally { right: 12px; bottom: 12px; padding: 8px 10px; gap: 9px; }
    .tally svg { width: 36px; height: 36px; } .tally .num { font-size: 16px; } }
  @media (prefers-reduced-motion: reduce) { .tally, .tally rect.new { transition: none; animation: none; } }
  @media (prefers-reduced-motion: reduce) { .stage img { transition: none; } }
</style>
</head>
<body>
  <main>
    <div class="stage" id="stage">
      <video id="film" autoplay muted playsinline preload="auto" poster="media/centuria_poster.jpg">
        <source src="media/centuria_720.mp4" type="video/mp4" media="(max-width: 900px)">
        <source src="media/centuria_1080.mp4" type="video/mp4">
      </video>
      <img src="media/centuria_poster.jpg" alt="CENTURIA, AI solutions architect">
      <button class="sound" id="sound" type="button">Play with sound</button>
    </div>
  </main>
  <section class="copy">
    <p class="soon">COMING SOON</p>
    <p class="slogan">The hundred are gathering.</p>
  </section>
  <aside class="tally" id="tally" aria-live="polite" hidden>
    <svg viewBox="0 0 46 46" aria-hidden="true" id="grid"></svg>
    <div class="t"><span class="lab">GATHERED</span><span class="num" id="num"></span></div>
  </aside>
<script>
  const v = document.getElementById("film"), stage = document.getElementById("stage"), btn = document.getElementById("sound");
  // Browsers only autoplay muted video; the button restarts the film with its sound.
  btn.addEventListener("click", () => {
    stage.classList.remove("ended");
    v.muted = false; v.currentTime = 0; v.play();
    btn.hidden = true;
  });
  v.addEventListener("ended", () => { stage.classList.add("ended"); btn.textContent = "Play again"; btn.hidden = false; });

  // The hundred: one square per visitor in a 10 x 10 grid, the count in Roman numerals.
  (() => {
    const box = document.getElementById("tally"), grid = document.getElementById("grid"), num = document.getElementById("num");
    const API = "https://abacus.jasoncameron.dev/", KEY = "centuria-sk/gathering";
    const roman = n => { let r = ""; for (const [v, s] of [[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]]) while (n >= v) { r += s; n -= v; } return r; };
    let seen = false, last = 0;
    try { seen = localStorage.getItem("centuria-gathered") === "1"; last = +localStorage.getItem("centuria-count") || 0; } catch (e) {}
    const draw = (n, fresh) => {
      const filled = n % 100 === 0 ? 100 : n % 100, legion = Math.floor((n - 1) / 100);
      let out = "";
      for (let i = 0; i < 100; i++) {
        const x = (i % 10) * 4.6, y = Math.floor(i / 10) * 4.6;
        out += '<rect x="' + x + '" y="' + y + '" width="3.4" height="3.4" class="' + (i < filled ? (i === filled - 1 && fresh ? "f new" : "f") : "") + '"/>';
      }
      grid.innerHTML = out;
      num.innerHTML = roman(n) + " <small>/ " + roman(100 * (legion + 1)) + "</small>";
      box.title = n + " of the hundred have gathered";
      box.hidden = false; requestAnimationFrame(() => requestAnimationFrame(() => box.classList.add("on")));
    };
    // Show the last known count at once; the free counter service can take seconds to answer.
    if (last) draw(last, false);
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 12000);
    fetch(API + (seen ? "get/" : "hit/") + KEY, { signal: ctl.signal }).then(r => r.ok ? r.json() : null).then(d => {
      const n = d ? Math.max(0, d.value | 0) : 0; if (!n) return;
      try { localStorage.setItem("centuria-gathered", "1"); localStorage.setItem("centuria-count", n); } catch (e) {}
      if (n !== last || !seen) draw(n, !seen);
    }).catch(() => {});
  })();
</script>
</body>
</html>
